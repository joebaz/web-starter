# Human-readable documentation only; no validator, hook, or workflow engine reads this file.
name: Lifecycle
applies_to: All issue types
authority:
  - This file owns the sequence, handoffs, approval gates, loops, update timing, and the Progress Readout.
  - Each step's method links to the role SOP or guide that says how to do it.
  - specs/15-lifecycle.md is the historical design record.
reading:
  - Stages run in order. Steps run in listed order unless a transition names another step.
  - Steps whose keys begin with parent- belong to the parent route. An ordinary step reaches them only through a transition.
  - Transitions target unique step keys, independent of position.
  - Wait at a gate until its condition is met.
  - Closing a stage opens the next stage on the issue's route. Closing Retro completes the Lifecycle.
  - A Coordinator resuming work enters at the step its reconciled state establishes, not at Define.
  - State that stays unknown waits at the gate it affects.
rules:
  routes:
    - An Atomic Issue follows the ordinary route, Define → Plan → Implement → Publish → Retro. Every issue is an Atomic Issue unless the Maintainer chooses the parent route for it.
    - A Parent Issue follows Define → Plan → Publish → Retro. Its Atomic Issues deliver the outcome, each through its own ordinary Lifecycle and category; the Parent Issue validates their combined result in Publish.
    - The Planner recommends a route, the Maintainer chooses it, and the Coordinator records the choice and its evidence. Category labels, skill output, and agent findings never choose the route, and no category requires a spec or Sub-Issues.
    - "Route rubric: an Atomic Issue fits one bounded deliverable with clear acceptance criteria. A Parent Issue fits a shared outcome that needs several bounded pieces of work coordinated through dependencies, shared requirements, or combined acceptance. Category, file count, duration, or the number of issues alone never decides the route."
    - An Atomic Issue may depend on other issues and need not be usable on its own. Several Atomic Issues under a Parent Issue may together deliver one Vertical Slice.
    - Recommend the smallest useful working result. What it needs to work belongs in it; optional breadth or hardening can become later issues if the Maintainer wants them. A route recommendation adds no scope.
  parent:
    - These rules apply on the parent route.
    - Only the Parent Issue's Planner edits its spec and Coordination Plans.
    - A Sub-Issue's Coordinator sends a needed parent spec change to the Parent Issue's Coordinator at once and pauses affected work. The Parent Issue's Coordinator relays the Maintainer's decision, including a decline.
    - Gate evidence names the artifact revision it covers. On entering or returning to a stage, skip each parent-* step whose evidence already matches. A requirements approval alone completes no parent review or assessment.
    - From any step, a spec that must change or lacks matching evidence returns to parent-spec-draft; a Coordination Plan returns to planner-briefing. Pause affected Sub-Issues under agents/roles/coordinator.md#when-approved-requirements-change.
    - Before the Parent Issue leaves Publish for Define or Plan, the Coordinator records, or keeps, a resume obligation naming the step to return to after publication. At plan-close without one, it records parent-child-issues. parent-publication-check closes it.
    - A spec change keeps the evidence of an unchanged plan. Keep earlier revisions, plans, launches, and publications, so a return neither repeats a launch nor loses a publication.
    - If no exact approved text of an artifact survives, rerun its gates.
    - In shared Publish steps, a Parent Issue's signed-off revision means its gated artifact revisions. Its PRs use Refs #<parent>. A tracker-only change needs readback evidence, not a PR or CI.
  authorization:
    - The Maintainer approves requirements, scope, and changes to either, and the final plan revision under rules.approvals.
    - Agent findings, recommendations, reports, checkpoints, and Progress Readouts authorize nothing.
    - When approved materials change, follow agents/roles/coordinator.md#when-approved-requirements-change.
  evidence:
    - PR and CI evidence stays in GitHub.
    - Detailed reports go in chat, as qa.md#report-results describes.
    - A step's evidence says where proof is recorded; it is not approval.
  requirements:
    - Approved requirements are one contract with scope, acceptance criteria, exclusions, and validation.
    - The contract is the issue's requirements, a spec issue, or a linked repository spec.
    - Record the artifact, a revision of its approved content, and the Maintainer's approval.
    - A tracker artifact's revision is its own edit snapshot or a digest of the approved content, not a bare URL or the issue's last update time.
    - A repository file's revision is a commit or blob.
    - An Agent Brief summarizes and links the approved requirements, and names the issue's route and any Parent Issue; it is neither a second contract nor an approval.
    - A skill-applied label or a checkpoint is not approval.
    - An already approved, ready issue needs no further approval and no second spec.
    - A proposed revision of a parent spec, such as a proposal comment, is not a second contract.
  approvals:
    - Requirements approval, plan approval, and final sign-off are separate Maintainer decisions; none implies another.
    - Requirements approval accepts the requirements contract in Define.
    - Plan approval accepts one final plan revision in Plan, after independent review and a decision on every finding.
    - Final sign-off accepts the implemented commit in Implement.
    - Plan approval names the plan's revision, a commit or blob. The Coder works only from an approved revision.
    - A plan revision is material when it changes an operation, a file in scope, wording to implement, a check, or the decision on a finding. A material revision needs a new plan approval.
    - Before Plan closes, a material revision from any step returns to implementation-plan, then plan-review and finding decisions before plan-approval.
    - After Plan closes, pause the work that depends on a material revision until the Maintainer approves the revised plan; continue under the normal cycle, review, and sign-off rules, with signed-off-assessment covering the final signed-off commit.
    - Other revisions, such as recording an already approved decision or fixing a typo or link, keep the approval. Record the new revision with the approval it falls under. Merely recording an already approved decision on a finding does not require another review.
    - On the parent route, spec sign-off is the requirements approval and Coordination Plan sign-off is the plan approval. Each comes after independent review. The spec then gets the Architect's assessment and the Maintainer's decisions on its recommendations. Publishing an artifact needs no further approval, and there is no final sign-off. A material revision returns under rules.parent.
  artifacts:
    - Create Task Artifacts only when needed, at the locations in agents/issue-tracker.md.
  state:
    - Dispatching an agent, invoking a skill, or starting a step does not complete it.
    - Record the observed outcome and its evidence, check the step's completion condition, then take the matching transition.
    - A running or waiting step, or one with an unresolved failure, stays current with its wait, error, or partial output recorded.
    - Kept output satisfies a later transition only through the evidence that transition names, such as a Maintainer direction.
  tracking:
    - On every stage entry, including a return to an earlier stage, refresh the native task list to that stage's steps.
    - At every transition, update the task list's step status.
    - Give the Progress Readout as progress_readout describes.
    - Follow agents/roles/coordinator.md#track-the-stage.
  review_exception:
    - Omit a separate Reviewer only with the Maintainer's explicit waiver for one isolated one- or two-line change.
    - Count the whole logical unreviewed change, not individual hunks; never split a larger change to qualify.
    - Record the waiver and its exact revision in chat and the checkpoint.
    - Re-evaluate eligibility for every revision; a waiver doesn't carry to other changes or later revisions.
    - An assignment does not imply a waiver.
    - Keep validation, final Maintainer sign-off, the final Architect assessment, cycle authorization, count and limits, and evidence matching the current revision.
    - Record an eligible exception as an exception; never claim a Reviewer pass.
    - On the parent route, review_exception applies to parent-spec-review and parent-plan-review, with the artifact's sign-off, and for the spec its assessment, in place of final sign-off and the final assessment.
  cycles:
    - A cycle is one round of changes followed by one independent review or a recorded eligible review_exception.
    - Count exempt rounds as cycles too.
    - Each cycle needs Maintainer authorization.
    - Starting the Coordinator authorizes the first cycle, after the go-ahead for a needs-triage issue.
    - Each later cycle needs a Maintainer request for changes or an authorized fix.
    - After Reviewer findings, the Coordinator gives them to the Maintainer and waits for the go-ahead before another cycle.
    - At most five cycles per issue; a sixth or later needs an explicit Maintainer extension.
    - Returning for further changes, including to coder-briefing from Implement or Publish, or a Parent Issue's return to Define or Plan, never resets the count.
    - On the parent route, each round of parent spec or Coordination Plan edits is a cycle, including the first Coordination Plan. Entering a stage authorizes no round. The Coordinator checks each round's authorization, count, and any extension at parent-spec-draft or parent-coordination-plan before the Planner edits.
    - A Parent Issue and each Sub-Issue keep separate counts. Parent validation checks are not cycles. Implementation Plan revisions and their reviews are not cycles and need no go-ahead under this rule; plan approval still applies under rules.approvals.
checkpoint:
  format: execution-checkpoint.md
  method: agents/roles/coordinator.md#keep-the-execution-checkpoint
  updates:
    - Whenever a step starts, waits, fails, or completes, and at every transition.
    - Whenever a decision, handoff, or recorded field changes.
progress_readout:
  when:
    - The Coordinator starts every message to the Maintainer that reports a change with the full Progress Readout.
    - A message without a change has none. There is no short form.
  source:
    - Build the Progress Readout from the execution checkpoint alone. Its steps give the markers; its waits, errors, and next give the current step's note.
    - The native task list mirrors the same record. A completed step is completed, the current step is in progress, and a pending step is pending. Without a task tool, the Progress Readout is the list.
  format:
    - "The first line is Stage: <stage name>, with no count and no emoji."
    - Each applicable step of the current stage follows, in Lifecycle order, by step key.
    - "[x] marks a step completed with recorded evidence, and [ ] marks a pending step."
    - The current step shows its status emoji in place of its checkbox, then a short note. When the Maintainer must act, the note names the exact action and gate; otherwise it says what is happening.
    - A step is conditional when some path from the stage's entry to its exit skips it. List a conditional step, and the steps its branch then runs in order, only once the transition into it is taken.
    - After a return to an earlier step, the steps that must run again show [ ]. Cycle counts and approvals are kept.
    - "Until the state is established, the Progress Readout is Stage: reconciling with no list. Never report a stage or step that isn't confirmed."
  status:
    about: Choose the current step's emoji by its status and what it waits on. A status emoji is not completion.
    🛑: An error or failure, with the error and the action needed. Status failed.
    ⏸️: A usage-limit pause, naming the agent and the reset time, or saying it's unknown. Status waiting on a usage limit.
    🟡: Needs the Maintainer's attention. Status waiting on the Maintainer.
    🟢: Work moving forward. Status started, or waiting on an agent or CI.
  examples: agents/roles/coordinator.md#track-the-stage
scenarios:
  about: Optional interview approaches and entry skills for Define. Declining one skips no step; the steps below still govern readiness and approval.
  method: agents/roles/planner.md#choose-an-interview-approach
stages:
  - name: Define
    entry:
      - The Maintainer starts a Coordinator on an issue.
      - A Parent Issue also enters here when the Maintainer chooses the parent route at scope-decision, or returns under rules.parent.
    exit: readiness-confirmation
    completion:
      - Requirements are approved and ready to plan; issue status is In progress.
      - A Parent Issue also has matching evidence for every parent-spec step.
    steps:
      - key: readiness-check
        role: Coordinator
        action: Establish the issue's state and route, and check that it is ready.
        method:
          - agents/roles/coordinator.md#start
          - agents/roles/coordinator.md#check-that-the-issue-is-ready
        evidence: Chat readiness report; the issue, its approved artifacts, and any route choice.
        transitions:
          - when: Atomic Issue; requirements approved under rules.requirements and ready; no repeat interview or approval.
            to: readiness-confirmation
          - when: Parent Issue; every parent-spec step has matching evidence.
            to: readiness-confirmation
          - when: Parent Issue without needs-triage; a parent-spec step lacks matching evidence.
            to: parent-spec-draft
          - when: needs-triage, or an Atomic Issue otherwise unready.
            to: planner-handoff
      - key: planner-handoff
        role: Coordinator
        action: Send the issue to the Planner, naming the gaps.
        evidence: Chat assignment and the issue.
      - key: requirements-interview
        role: Planner
        action: Interview the Maintainer and record the agreed requirements in the issue or its linked spec.
        method:
          - agents/roles/planner.md#capture-requirements
          - agents/triage-labels.md
        evidence: Issue or linked spec revision; chat interview.
      - key: requirements-review
        role: Maintainer
        action: Review the requirements contract under rules.requirements. When the Planner recommends the parent route under rules.routes, choose the route.
        evidence: Maintainer decision in chat or the issue, naming the artifact and revision, and any route choice.
        transitions:
          - when: Changes needed.
            to: requirements-interview
          - when: Accepted as an Atomic Issue.
            to: readiness-confirmation
          - when: The Maintainer chooses the parent route.
            to: parent-spec-draft
      - key: parent-spec-draft
        role: Coordinator and Planner
        action:
          - The Coordinator checks the round under rules.cycles and briefs the Planner.
          - The Planner drafts the spec or its authorized change and validates it. The approved live contract stays unchanged until publication.
        method:
          - agents/roles/planner.md#own-a-parent-issues-spec-and-plans
        evidence: Cycle record; proposed spec revision and validation results in chat.
      - key: parent-spec-review
        role: Coordinator and Reviewer
        action: The Coordinator records an eligible review_exception or dispatches a separate Reviewer on the whole changed spec revision.
        method:
          - agents/roles/reviewer.md#review
        evidence: Chat findings tied to the reviewed revision, or the recorded eligible waiver.
        transitions:
          - when: Findings.
            to: parent-spec-draft
          - when: No findings, or a recorded eligible review_exception.
            to: parent-spec-sign-off
      - key: parent-spec-sign-off
        role: Maintainer and Coordinator
        action: The Maintainer signs off the reviewed spec revision, approving the requirements, or requests changes.
        method:
          - agents/roles/coordinator.md#hand-back
        evidence: Maintainer sign-off in chat or the issue, naming the spec revision.
        transitions:
          - when: Changes requested.
            to: parent-spec-draft
          - when: Signed off.
            to: parent-spec-assessment
      - key: parent-spec-assessment
        role: Coordinator and Architect
        action: The Architect assesses the signed-off spec revision.
        method:
          - agents/roles/architect.md#work
        evidence: Architect assessment in chat, tied to the spec revision.
      - key: parent-spec-decisions
        role: Maintainer and Coordinator
        action: The Maintainer decides each Architect recommendation.
        evidence: Maintainer decisions in chat or the issue; updated checkpoint.
        transitions:
          - when: The Maintainer authorizes a spec change.
            to: parent-spec-draft
          - when: No spec change authorized.
            to: readiness-confirmation
      - key: readiness-confirmation
        role: Coordinator
        action:
          - Confirm readiness.
          - Change the issue's status from To do to In progress, or keep it In progress.
          - Close Define; the Plan stage needs no entry approval.
        method:
          - agents/roles/coordinator.md#change-github-project-status
        evidence: Issue status and chat confirmation; updated checkpoint.
  - name: Plan
    entry:
      - Define is closed.
      - A Parent Issue also returns here under rules.parent, or from parent-gap-triage for a corrective batch.
    exit: plan-close
    completion:
      - A separate Reviewer has reviewed the plan.
      - Every finding has a decision.
      - The plan reflects authorized feedback, with no pending scope decision.
      - The Maintainer has approved the final plan revision under rules.approvals.
      - A Parent Issue instead needs its active Coordination Plan reviewed and signed off under rules.approvals, unless planner-briefing recorded "no new plan".
    steps:
      - key: planner-briefing
        role: Coordinator
        action:
          - Brief the Planner on the approved requirements, artifacts, and constraints.
          - For a Parent Issue, record "no new plan" instead when its active Coordination Plan is unaffected, or the next correction is a single Sub-Issue with no plan change.
        evidence: Chat briefing with requirement references and revisions, or the no-new-plan record.
        transitions:
          - when: Atomic Issue.
            to: implementation-plan
          - when: Parent Issue needing a new or changed Coordination Plan.
            to: parent-coordination-plan
          - when: Parent Issue with "no new plan" recorded.
            to: plan-close
      - key: implementation-plan
        role: Planner
        action: Build the Implementation Plan.
        method:
          - agents/roles/planner.md#plan-the-implementation
        evidence: Plan file and revision linked in chat.
      - key: plan-review
        role: Coordinator and Reviewer
        action:
          - The Coordinator dispatches a separate Reviewer on the plan revision.
          - On every return before Plan closes, regardless of the originating step, the Reviewer reviews the material changes since the last reviewed revision under rules.approvals.
        method:
          - agents/roles/reviewer.md#review
        evidence: Reviewer findings in chat, tied to the plan revision.
      - key: plan-findings
        role: Planner and Coordinator
        action:
          - The Coordinator sends the Reviewer's findings to the Planner.
          - The Planner revises the plan for in-scope findings.
          - The Planner refers out-of-scope findings and any proposed split through the Coordinator to the Maintainer.
        evidence: Findings and their decisions in chat; revised plan.
        transitions:
          - when: Out-of-scope findings or a proposed split need decisions.
            to: scope-decision
          - when: No out-of-scope finding or proposed split is pending.
            to: plan-approval
      - key: scope-decision
        role: Maintainer and Planner
        action:
          - The Maintainer decides each pending out-of-scope finding once, and any proposed split, including whether to choose the parent route under rules.routes.
          - The Planner revises the plan for approved ones.
        method:
          - agents/roles/coordinator.md#when-approved-requirements-change
        evidence: Maintainer decisions in chat or the issue; updated plan and checkpoint.
        transitions:
          - when: The Maintainer chooses the parent route. Keep the earlier plan and the cycle count.
            to: parent-spec-draft
          - when: A decision makes a material plan revision under rules.approvals.
            to: implementation-plan
          - when: Decisions recorded with no material plan revision.
            to: plan-approval
      - key: plan-approval
        role: Maintainer and Coordinator
        action:
          - The Coordinator asks the Maintainer to approve the final plan revision.
          - The Maintainer approves that revision or requests changes.
        method:
          - agents/roles/coordinator.md#hand-back
        evidence: Maintainer approval in chat or the issue, naming the plan revision; the checkpoint's plan evidence.
        transitions:
          - when: Changes requested.
            to: implementation-plan
          - when: Approved.
            to: plan-close
      - key: parent-coordination-plan
        role: Coordinator and Planner
        action:
          - The Coordinator checks the round under rules.cycles and briefs the Planner.
          - The Planner writes or revises the Coordination Plan, with each new Sub-Issue's exact proposed content, and validates it. A corrective batch gets a separate linked plan.
        method:
          - agents/roles/planner.md#own-a-parent-issues-spec-and-plans
        evidence: Cycle record; plan file and revision linked in chat, with validation results.
      - key: parent-plan-review
        role: Coordinator and Reviewer
        action: The Coordinator records an eligible review_exception or dispatches a separate Reviewer on the whole changed plan revision.
        method:
          - agents/roles/reviewer.md#review
        evidence: Chat findings tied to the reviewed revision, or the recorded eligible waiver.
        transitions:
          - when: Findings.
            to: parent-coordination-plan
          - when: No findings, or a recorded eligible review_exception.
            to: parent-plan-sign-off
      - key: parent-plan-sign-off
        role: Maintainer and Coordinator
        action: The Maintainer signs off the reviewed plan revision, approving the plan, or requests changes.
        method:
          - agents/roles/coordinator.md#hand-back
        evidence: Maintainer sign-off in chat or the issue, naming the plan revision.
        transitions:
          - when: Changes requested.
            to: parent-coordination-plan
          - when: Signed off.
            to: plan-close
      - key: plan-close
        role: Coordinator
        action: Confirm the Plan stage's obligations and close it.
        evidence: Chat confirmation and updated checkpoint.
        transitions:
          - when: Atomic Issue; Implement opens.
            to: coder-briefing
          - when: Parent Issue; Publish opens.
            to: parent-publication-check
  - name: Implement
    entry:
      - Plan is closed, or Publish returns for an authorized file change.
      - Every cycle meets rules.cycles before changes start.
      - The Coder works from a plan revision approved under rules.approvals.
    exit: implementation-evidence
    completion:
      - The current revision has an independent review or a recorded eligible review_exception.
      - The Maintainer has given final sign-off.
      - The Architect has assessed the signed-off commit.
      - The review or waiver and all other evidence match that revision.
      - No authorized changes remain.
    steps:
      - key: coder-briefing
        role: Coordinator
        action:
          - Check cycle authorization and count, including an explicit extension for cycle six or later.
          - Brief the Coder on requirements, the approved plan revision, references, scope, and assignment, with the Coder as the one editor.
          - Record the cycle without resetting earlier cycles.
        evidence: Chat assignment; checkpoint cycle count and Maintainer authorization.
      - key: implementation-validation
        role: Coder and Coordinator
        action:
          - The Coder implements the assigned change and validates it under the plan.
          - For a new or substantially revised document, the Coder first sends a short outline to the Coordinator, who gets the Maintainer's approval; the Coder expands it only then.
        method:
          - agents/roles/coder.md#work
          - ../CONTRIBUTING.md#validate-your-change
          - qa.md
        evidence: Repository diff; chat outline approval when applicable, and validation report.
      - key: reviewer-dispatch
        role: Coordinator
        action:
          - Re-evaluate review_exception eligibility for the current revision.
          - With a recorded eligible waiver, go to Maintainer review.
          - Otherwise, dispatch a separate Reviewer on the whole changed issue revision, including earlier cycles' changes.
        evidence: Chat assignment, or the eligible waiver naming the exact revision; checkpoint record.
        transitions:
          - when: A recorded eligible review_exception applies to this revision.
            to: maintainer-review
          - when: No recorded eligible waiver applies.
            to: independent-review
      - key: independent-review
        role: Reviewer
        action: Check the change, run the applicable checks, and report findings and a recommendation.
        method:
          - agents/roles/reviewer.md#review
        evidence: Chat findings and check results, tied to the reviewed revision.
        transitions:
          - when: Findings; wait for the Maintainer's go-ahead before another cycle.
            to: coder-briefing
          - when: No findings.
            to: maintainer-review
      - key: maintainer-review
        role: Maintainer and Coordinator
        action:
          - The Maintainer reviews the file diffs, comments, and commits.
          - If changes are needed, the Coordinator reconciles the feedback with the commit and briefs the remaining changes.
          - Re-evaluate the review policy on the next revision; any independent review covers the whole changed issue revision.
          - Otherwise, the Maintainer gives final sign-off.
        evidence: Maintainer feedback or final sign-off naming the commit; checkpoint decision.
        transitions:
          - when: The Maintainer requests changes.
            to: coder-briefing
          - when: Final sign-off given.
            to: signed-off-assessment
      - key: signed-off-assessment
        role: Coordinator and Architect
        action:
          - Dispatch the Architect to assess the signed-off commit.
          - Take the recommendations to the Maintainer for a decision.
        method:
          - agents/roles/architect.md#work
        evidence: Chat Architect assessment and Maintainer decision, tied to the commit.
        transitions:
          - when: The Maintainer authorizes changes.
            to: coder-briefing
          - when: No changes authorized.
            to: implementation-evidence
      - key: implementation-evidence
        role: Coordinator
        action: Confirm every Implement completion condition and close the stage.
        evidence: Matching sign-off, assessment, review or eligible waiver, and validation references; updated checkpoint.
  - name: Publish
    entry:
      - "Atomic Issue: Implement is closed for the revision to publish."
      - "Parent Issue: Plan is closed."
    exit:
      - "Atomic Issue: merge-confirmation."
      - "Parent Issue: parent-outcome-acceptance."
    completion:
      - "Atomic Issue: the signed-off revision is merged into main, the remote branch is deleted, and the Maintainer confirms the merge."
      - "Parent Issue: every approved artifact is published, every Sub-Issue has completed, the contract and integration checks pass on their combined revision, and the Maintainer has accepted it."
    steps:
      - key: remote-push
        role: Maintainer
        action: Push the signed-off revision to the remote.
        evidence: GitHub commit and remote revision.
      - key: pull-request
        role: Coordinator
        action: Open the PR, or reuse the issue's open PR for a new revision.
        method:
          - ../CONTRIBUTING.md#open-a-pull-request
        evidence: GitHub PR linking the issue and summarizing validation.
      - key: ci-result
        role: GitHub
        action: Run CI on the pushed commit.
        evidence: GitHub CI results tied to the commit.
        transitions:
          - when: CI passes.
            to: maintainer-merge
          - when: CI fails.
            to: ci-diagnosis
      - key: ci-diagnosis
        role: Coordinator
        action:
          - Diagnose the CI failure or merge blocker.
          - A transient failure needs no file change; CI reruns on the same commit.
          - A file change needs Maintainer authorization and a full return through Implement, including its evidence check, before remote-push updates the same PR. For a Parent Issue, it returns to the artifact's owning stage instead.
        evidence: Chat diagnosis and authorization; GitHub CI and PR evidence.
        transitions:
          - when: Atomic Issue; file change needed; wait for Maintainer authorization.
            to: coder-briefing
          - when: Parent Issue; spec change needed; wait for Maintainer authorization.
            to: parent-spec-draft
          - when: Parent Issue; Coordination Plan change needed; wait for Maintainer authorization.
            to: planner-briefing
          - when: Transient failure, no file change.
            to: ci-result
      - key: maintainer-merge
        role: Maintainer and Coordinator
        action:
          - The Maintainer merges into main only with passing CI, no pending PR feedback, and the pushed revision matching the signed-off commit.
          - Pending feedback or a revision mismatch blocks the merge, even when CI passes.
          - The Coordinator reports a blocker in chat and waits for the Maintainer's direction.
        evidence: GitHub PR, CI, commit comparison, and merge; chat blocker or direction.
        transitions:
          - when: Blocked, and the direction requires a file change.
            to: ci-diagnosis
          - when: Blocked without an authorized file change; wait for direction and recheck the gate.
            to: maintainer-merge
          - when: Merged with every gate met.
            to: remote-branch-deletion
      - key: remote-branch-deletion
        role: GitHub
        action: Delete the remote branch.
        evidence: GitHub branch deletion on the PR.
      - key: merge-confirmation
        role: Maintainer and Coordinator
        action:
          - The Maintainer confirms the merge.
          - The Coordinator closes Publish, or for a Parent Issue returns to parent-publication-check.
        evidence: GitHub merge, chat confirmation, and updated checkpoint.
        transitions:
          - when: Atomic Issue; Publish closed and Retro opens.
            to: retro-drafts
          - when: Parent Issue; merge confirmed.
            to: parent-publication-check
      - key: parent-publication-check
        role: Coordinator
        action:
          - Check that each artifact's validation, review, and sign-off evidence, and the spec's assessment evidence, names the same revision, and compare it with the published copy.
          - Publish only what differs. The Maintainer commits repository artifacts before remote-push.
          - When everything matches, update the Parent Issue's plan links, close the resume obligation, and go to the step it names.
        method:
          - agents/roles/coordinator.md#publish-parent-artifacts
        evidence: Each artifact's gated revision beside its merged commit or live readback digest; the closed resume obligation.
        transitions:
          - when: A repository artifact is unpublished.
            to: remote-push
          - when: A tracker artifact is unpublished.
            to: parent-tracker-publication
          - when: All published; the resume obligation names parent-child-scope-approval.
            to: parent-child-scope-approval
          - when: All published; the resume obligation names parent-child-issues.
            to: parent-child-issues
          - when: All published; the resume obligation names parent-children-wait.
            to: parent-children-wait
          - when: All published; the resume obligation names parent-contract-check.
            to: parent-contract-check
      - key: parent-tracker-publication
        role: Coordinator
        action: Copy the signed-off spec snapshot into the Parent Issue's body, read it back, and check that its digest matches.
        method:
          - agents/roles/coordinator.md#publish-parent-artifacts
        evidence: Live body digest matching the approved snapshot.
        transitions:
          - when: Published and verified.
            to: parent-publication-check
      - key: parent-child-scope-approval
        role: Maintainer and Coordinator
        action: The Maintainer approves the proposed corrective Sub-Issue's scope and acceptance criteria, which authorizes its creation and launch, or asks for changes, or declines it.
        evidence: Maintainer decision in chat or the issue, naming the proposal revision.
        transitions:
          - when: Approved.
            to: parent-child-issues
          - when: Changes requested or declined.
            to: parent-gap-triage
      - key: parent-child-issues
        role: Coordinator
        action: Create each approved Sub-Issue from its exact proposed content, or reuse one already recorded.
        method:
          - agents/roles/coordinator.md#create-and-launch-sub-issues
        evidence: Sub-Issue links and body digests matching the approved proposals.
      - key: parent-child-launch
        role: Coordinator
        action: For each created Sub-Issue whose dependencies are met, create its workspace and start its Coordinator, or reuse recorded ones. A launch waives none of its gates or blockers.
        method:
          - agents/roles/coordinator.md#create-and-launch-sub-issues
        evidence: Sub-Issue workspace and session records.
      - key: parent-children-wait
        role: Coordinator
        action: Keep the Parent Issue In progress, record each Sub-Issue's outstanding hand back and the next action, and act on events, such as a Sub-Issue's message or the Maintainer's.
        method:
          - agents/roles/coordinator.md#wait-for-sub-issues
        evidence: Sub-Issue hand backs with their evidence; checkpoint waits and obligations.
        transitions:
          - when: A created, unlaunched Sub-Issue's dependencies are now met.
            to: parent-child-launch
          - when: Sub-Issues are still running, and none is ready to launch.
            to: parent-children-wait
          - when: Every Sub-Issue has completed and handed back.
            to: parent-contract-check
      - key: parent-contract-check
        role: Coordinator and Reviewer
        action: A separate Reviewer checks the Sub-Issues' combined delivered revision against every parent criterion and its acceptance evidence, and uses the combined result as visitors or readers would, with applicable website checks or, for documentation-only work, a task and consistency walkthrough. Closed Sub-Issues alone aren't evidence.
        method:
          - agents/roles/coordinator.md#validate-the-combined-result
          - agents/roles/reviewer.md#review
          - qa.md#check-that-the-website-works
        evidence: Chat results naming the combined revision and each criterion.
        transitions:
          - when: Checks are running, incomplete, or failed to run; result and next action recorded. Rerun when ready.
            to: parent-contract-check
          - when: Complete; a criterion fails or a substantial related gap is found.
            to: parent-gap-triage
          - when: Complete; every criterion passes and no substantial related gap is found.
            to: parent-validation
      - key: parent-validation
        role: Coordinator and Architect
        action: Using the Reviewer's evidence, the Architect assesses how the same finalized combined revision fits the existing codebase, relevant outstanding issues, system boundaries, and code health.
        method:
          - agents/roles/coordinator.md#validate-the-combined-result
          - agents/roles/architect.md#work
        evidence: Chat assessment naming the combined revision, the Reviewer's evidence, and the integration findings.
        transitions:
          - when: Checks are running, incomplete, or failed to run; result and next action recorded. Rerun when ready.
            to: parent-validation
          - when: Complete; an integration problem or substantial related gap is found.
            to: parent-gap-triage
          - when: Complete; integration passes with no substantial related gap.
            to: parent-outcome-acceptance
      - key: parent-gap-triage
        role: Coordinator, Planner, and Maintainer
        action:
          - The Coordinator sends the gaps to the Planner, who triages them, read-only, into proposed new Sub-Issues grouped by outcome. Count new Sub-Issues, not findings.
          - The Coordinator proposes unrelated improvements to the Maintainer separately.
          - The Maintainer decides. A required gap blocks acceptance until it is resolved or removed from the approved requirements; filing, closing, cancelling, or deferring an issue doesn't resolve it.
        method:
          - agents/roles/coordinator.md#validate-the-combined-result
          - agents/roles/planner.md#own-a-parent-issues-spec-and-plans
        evidence: Triage proposal in chat; Maintainer decisions.
        transitions:
          - when: The Maintainer authorizes a spec change. This goes first, even with new Sub-Issues.
            to: parent-spec-draft
          - when: No spec change; two or more new Sub-Issues, or a Coordination Plan change.
            to: planner-briefing
          - when: No spec or plan change; one new Sub-Issue.
            to: parent-child-scope-approval
          - when: No spec or plan change and no new Sub-Issue; the checks need rerunning or correcting.
            to: parent-contract-check
          - when: No spec or plan change and no new Sub-Issue; every criterion passes and the Maintainer rules the contract check's remaining gaps not required.
            to: parent-validation
          - when: No spec or plan change and no new Sub-Issue; the Maintainer rules the integration check's remaining gaps not required.
            to: parent-outcome-acceptance
          - when: Triage or the Maintainer's decision is pending.
            to: parent-gap-triage
      - key: parent-outcome-acceptance
        role: Maintainer and Coordinator
        action: With contract and integration evidence for the same combined revision, the Maintainer accepts the combined outcome against the current criteria, or gives direction. On acceptance, the Coordinator closes Publish.
        method:
          - agents/roles/coordinator.md#hand-back
        evidence: Maintainer acceptance in chat or the issue, naming the combined revision both checks covered.
        transitions:
          - when: Accepted.
            to: retro-drafts
          - when: The Maintainer asks for a rerun or more evidence.
            to: parent-contract-check
          - when: Not accepted.
            to: parent-gap-triage
  - name: Retro
    entry: Publish is closed.
    exit: retro-close
    completion:
      - retro-drafts ended in one of three ways. A skip was recorded before any drafts existed; a completed /retro run was recorded with zero candidates and no kept drafts; or every presented draft is filed exactly as approved or dropped.
      - All other stage obligations are met.
    steps:
      - key: retro-drafts
        role: Coordinator and Maintainer
        action:
          - This step is optional until session capture exists.
          - The Maintainer starts /retro (mattpocock-skills:retro) or skips it; the Coordinator records the outcome and presents any drafts.
        method:
          - agents/roles/coordinator.md#run-retro-drafts
        evidence:
          - The Maintainer's run-or-skip answer in chat.
          - For a run, the skill invocation, then its drafts, zero-candidate result, or error and partial output, in chat and the checkpoint.
          - For a skip, the no-draft skip record in chat and the checkpoint.
        transitions:
          - when: /retro is running, or a failed or partial run awaits the Maintainer's direction; wait, error, partial output, and next action recorded.
            to: retro-drafts
          - when: Skipped before any drafts, including kept partial drafts, exist; skip recorded.
            to: retro-close
          - when: Candidate drafts are ready for decision, either from a completed /retro run with any kept partial drafts, or as kept partial drafts the Maintainer has explicitly directed to decide, with the failed run still recorded as failed.
            to: retro-draft-decisions
          - when: /retro completed with zero candidates and no kept drafts; result recorded.
            to: retro-close
      - key: retro-draft-decisions
        role: Maintainer and Coordinator
        action:
          - The Maintainer reviews each draft.
          - The Coordinator revises commented drafts for another review.
          - The Coordinator files approved drafts exactly as approved.
          - The Coordinator drops declined drafts.
        evidence: Chat decisions and revised drafts; GitHub issues for approved drafts.
        transitions:
          - when: Any draft still needs revision, review, or filing.
            to: retro-draft-decisions
          - when: Every draft filed or dropped.
            to: retro-close
      - key: retro-close
        role: Coordinator
        action:
          - Confirm every stage obligation is met, including the recorded skip, the recorded zero-candidate result, or every draft filed or dropped.
          - For a Parent Issue, once every checkpoint obligation is also met, close the issue and verify that its Project status is Done. No final edit or PR is needed.
          - Close Retro, completing the Lifecycle.
          - Hand back to the Maintainer and tell them the worktree can be archived. A Sub-Issue also sends its final hand back to the Parent Issue's Coordinator and records delivery; a failed delivery keeps that obligation open.
        method:
          - agents/roles/coordinator.md#change-github-project-status
          - agents/roles/coordinator.md#coordinate-a-sub-issue
        evidence: Chat completion confirmation, hand back, and archive notice; checkpoint with Retro closed. For a Parent Issue, the closed issue and Done status; for a Sub-Issue, the delivered final hand back.
