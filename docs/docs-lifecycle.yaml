# Human-readable documentation only; no validator, hook, or workflow engine consumes this file.
name: Docs lifecycle
scope: Repository documentation and instructions only.
authority: >-
  This file owns the operational sequence, handoffs, approval gates, and loops for
  Docs issues. specs/15-docs-lifecycle.md is the historical design record.
  Content, Fix, and Feature issues retain the Coordinator SOP and ../CONTRIBUTING.md sequence.
reading: >-
  Stages and their steps run in listed order unless a condition selects a named
  destination. All transition destinations are globally unique semantic step keys,
  independent of position. Wait at a gate until its condition is satisfied.
  Closing a stage opens the next; closing Retro completes the lifecycle, before
  the final checkpoint upload. A failed upload leaves that post-completion obligation open.
methods:
  coordinator: agents/roles/coordinator.md
  planner: agents/roles/planner.md
  architect: agents/roles/architect.md
  coder: agents/roles/coder.md
  reviewer: agents/roles/reviewer.md
  contribution: ../CONTRIBUTING.md
  validation: ../CONTRIBUTING.md#validate-your-change
  qa: qa.md
  changed_requirements: agents/roles/coordinator.md#when-approved-requirements-change
rules:
  authorization: >-
    The Maintainer approves requirements, scope, and changes to either. Agent
    findings, recommendations, reports, checkpoints, and readouts authorize nothing.
    Apply the changed-requirements protocol whenever approved materials change.
  evidence: >-
    PR and CI evidence stays in GitHub. Detailed reports go in chat under the QA
    reference. Evidence below names where proof is recorded, not a substitute for approval.
  tracking: >-
    The Coordinator uses native tasks (Codex update_plan; Claude Code TaskCreate
    and TaskUpdate) for the active stage's applicable steps as descriptive tasks.
    Keep the lifecycle open until retro-close. Start every response to the Maintainer
    with a one-line readout such as Stage: Implement 3 of 7 done.
  artifacts: >-
    Create artifacts only when needed. Specs live at docs/specs/<issue>-<slug>.md,
    linked from their issue, and plans at docs/plans/<issue>-<slug>.md. Agent-facing
    instructions and project-owned references stay in the repository; the Wiki
    stays the Maintainer's checklist.
  review_exception: >-
    Omit a separate Reviewer only with the Maintainer's explicit waiver for a
    particular isolated one- or two-line change. Record the waiver and exact
    revision in chat and, for Docs issues, the execution checkpoint. Count the whole logical
    unreviewed delta, not individual hunks; never split a larger change to qualify.
    Re-evaluate eligibility for every revision; a waiver does not carry to unrelated
    changes or later revisions. Direct Maintainer assignment does not imply a waiver.
    Retain validation, final Maintainer sign-off, final Architect assessment, cycle
    authorization, count and limits, and evidence matching the current revision.
    Record the eligible exception honestly instead of claiming a Reviewer pass.
    Coordinator and Coder SOPs also reference this shared policy for other issue
    types; their existing sequencing otherwise remains unchanged.
  cycles: >-
    One cycle is one round of changes followed by one independent review or a
    recorded eligible review_exception. Count exempt rounds too. Each cycle
    needs Maintainer authorization. Starting the Coordinator authorizes the first
    cycle, after the go-ahead for a needs-triage issue. Each later cycle requires
    a Maintainer request for changes or an authorized fix. At most five cycles
    per issue; a sixth or later requires an explicit Maintainer extension.
    Returning to coder-briefing from Implement or Publish never resets the count.
checkpoint:
  location: /tmp/issues/<issue>.yaml
  purpose: One working record per issue, separate from this shared definition.
  contents:
    - Current stage and next step
    - Completed stages and active waits
    - Requirement and plan references with their revisions
    - Assessed revision and its evidence
    - Cycle count and recorded approvals, including any review waiver and its exact revision
    - Outstanding decisions
  updates: At every stage close and key Maintainer decision.
  recovery: >-
    A fresh or compacted Coordinator loads the checkpoint and reconciles it with
    the current repository and issue before advancing. It records progress, not approval.
  durability: >-
    /tmp files can disappear. The lasting copy is uploaded to an issue comment
    after lifecycle completion at checkpoint-upload. No checkpoint template is required.
stages:
  - name: Define
    entry: The Maintainer starts a Coordinator on an issue.
    exit: readiness-confirmation
    completion: Requirements are approved and ready to plan; issue status is In progress.
    steps:
      - key: readiness-check
        role: Coordinator
        action: Run Start and readiness checks from the Coordinator SOP.
        evidence: Chat readiness report; issue and its approved artifacts.
        transitions:
          - when: Already approved and ready; no repeat interview or approval.
            to: readiness-confirmation
          - when: needs-triage or otherwise unready.
            to: planner-handoff
      - key: planner-handoff
        role: Coordinator
        action: Send the issue to the Planner, naming the gaps.
        evidence: Chat assignment and issue.
      - key: requirements-interview
        role: Planner
        action: >-
          Interview the Maintainer and record agreed requirements in the issue or
          its linked spec, following the Planner SOP and agents/triage-labels.md.
        evidence: Issue or linked spec revision; chat interview.
      - key: requirements-review
        role: Maintainer
        action: Review the requirements.
        evidence: Maintainer decision in chat or the issue.
        transitions:
          - when: Changes needed.
            to: requirements-interview
          - when: Accepted.
            to: readiness-confirmation
      - key: readiness-confirmation
        role: Coordinator
        action: >-
          Confirm readiness, change To do to In progress using the Coordinator SOP's
          status method, and close Define.
          Plan needs no further approval.
        evidence: Issue status and chat confirmation; updated checkpoint.
  - name: Plan
    entry: Define is closed.
    exit: plan-close
    completion: >-
      The plan has been assessed by the Architect, recommendations have decisions,
      and the plan reflects authorized feedback with no pending scope decision.
    steps:
      - key: planner-briefing
        role: Coordinator
        action: Brief the Planner on approved requirements, artifacts, and constraints.
        evidence: Chat briefing with requirement references and revisions.
      - key: implementation-plan
        role: Planner
        action: Build the implementation plan in docs/plans/ under the Planner SOP.
        evidence: Plan file and revision linked in chat.
      - key: plan-assessment
        role: Coordinator and Architect
        action: The Coordinator asks the Architect to assess the plan.
        evidence: Architect assessment in chat tied to the plan revision.
      - key: recommendations-review
        role: Planner and Coordinator
        action: >-
          The Planner reviews recommendations and revises the plan for in-scope
          ones. Refer out-of-scope recommendations through the Coordinator to the Maintainer.
        evidence: Recommendations and disposition in chat; revised plan.
        transitions:
          - when: Out-of-scope recommendations need decisions.
            to: scope-decision
          - when: No pending out-of-scope recommendation.
            to: plan-close
      - key: scope-decision
        role: Maintainer and Planner
        action: >-
          The Maintainer decides each pending out-of-scope recommendation once.
          The Planner revises for approved ones; apply the changed-requirements protocol.
        evidence: Maintainer decisions in chat or issue; updated plan and checkpoint.
      - key: plan-close
        role: Coordinator
        action: Confirm Plan obligations and close the stage.
        evidence: Chat confirmation and updated checkpoint.
  - name: Implement
    entry: >-
      Plan is closed, or Publish returns for an authorized file change. Every
      cycle meets the authorization and extension rules before changes start.
    exit: implementation-evidence
    completion: >-
      The current revision has independent review or a recorded eligible
      review_exception, the Maintainer's final sign-off, and the final Architect
      assessment of the signed-off commit. Review or waiver and all other evidence
      match that revision; no authorized changes remain.
    steps:
      - key: coder-briefing
        role: Coordinator, or Maintainer and Coder for a confirmed direct assignment while the Coordinator is unavailable
        action: >-
          Check cycle authorization and count, including an explicit extension for
          cycle six or later. Brief the Coder on requirements, plan, references,
          and assignment. Record the cycle without resetting earlier cycles.
          For a confirmed direct Maintainer assignment while the Coordinator is
          unavailable, confirm the same briefing, scope, one-editor ownership, and
          authorization checks directly with the Maintainer. Record the assignment
          and cycle evidence for reconciliation with the Coordinator on return;
          preserve all later validation and review gates.
        evidence: Chat assignment; checkpoint cycle count and Maintainer authorization.
      - key: implementation-validation
        role: Coder and Coordinator
        action: >-
          Implement the assigned Maintainer change and validate under the plan,
          Coder SOP, contribution requirements, and QA reference. For a new or
          substantially revised document, first send a short outline to the
          Coordinator, who gets the Maintainer's approval; expand it only then.
          For a confirmed direct assignment while the Coordinator is unavailable,
          obtain that outline approval directly from the Maintainer.
        evidence: Repository diff; chat outline approval when applicable and validation report.
      - key: reviewer-dispatch
        role: Coordinator
        action: >-
          Re-evaluate review_exception eligibility for the current revision. With
          a recorded eligible waiver, proceed to Maintainer review. Otherwise
          dispatch a separate Reviewer on the whole changed issue revision,
          including earlier changes, not just the latest round.
        evidence: Chat assignment or eligible waiver naming the exact revision; checkpoint record.
        transitions:
          - when: A recorded eligible review_exception applies to this revision.
            to: maintainer-review
          - when: No eligible recorded waiver applies.
            to: independent-review
      - key: independent-review
        role: Reviewer
        action: Check the change, run applicable checks, and report findings and a recommendation.
        evidence: Chat findings and check results tied to the reviewed revision.
        transitions:
          - when: Findings; wait for the Maintainer's go-ahead before another cycle.
            to: coder-briefing
          - when: No findings.
            to: maintainer-review
      - key: maintainer-review
        role: Maintainer and Coordinator
        action: >-
          The Maintainer reviews file diffs, comments, and commits. If changes
          are needed, the Coordinator reconciles feedback with the commit and
          briefs remaining changes; re-evaluate the review policy on the next revision,
          and any independent review covers the whole changed issue revision.
          Otherwise the Maintainer gives final sign-off.
        evidence: Maintainer feedback or final sign-off naming the commit; checkpoint decision.
        transitions:
          - when: Maintainer requests changes.
            to: coder-briefing
          - when: Final sign-off given.
            to: signed-off-assessment
      - key: signed-off-assessment
        role: Coordinator and Architect
        action: >-
          Dispatch the Architect to assess the signed-off commit and take the
          recommendations to the Maintainer for a decision.
        evidence: Chat Architect assessment and Maintainer decision tied to the commit.
        transitions:
          - when: Maintainer authorizes changes.
            to: coder-briefing
          - when: No changes authorized.
            to: implementation-evidence
      - key: implementation-evidence
        role: Coordinator
        action: Confirm all Implement completion conditions and close the stage.
        evidence: Matching sign-off, assessment, review or eligible waiver, and validation references; updated checkpoint.
  - name: Publish
    entry: Implement is closed for the revision to publish.
    exit: merge-confirmation
    completion: Signed-off revision merged into main, remote branch deleted, and Maintainer confirms merge.
    steps:
      - key: remote-push
        role: Maintainer
        action: Push the signed-off revision to the remote.
        evidence: GitHub commit and remote revision.
      - key: pull-request
        role: Coordinator
        action: >-
          Open the PR under ../CONTRIBUTING.md#open-a-pull-request or reuse the issue's
          open PR for a new revision.
        evidence: GitHub PR linking the issue and summarizing validation.
      - key: ci-result
        role: GitHub
        action: Run CI on the pushed commit.
        evidence: GitHub CI results tied to the commit.
        transitions:
          - when: CI passes.
            to: maintainer-merge
          - when: CI fails.
            to: ci-diagnosis
      - key: ci-diagnosis
        role: Coordinator
        action: >-
          Diagnose CI failure or a merge blocker. A file change requires Maintainer
          authorization and a return through all of Implement, including its evidence
          check, before remote-push updates the same PR. A transient failure needs
          no file change and reruns CI on the same commit.
        evidence: Chat diagnosis and authorization; GitHub CI and PR evidence.
        transitions:
          - when: File change needed; wait for Maintainer authorization.
            to: coder-briefing
          - when: Transient failure, no file change.
            to: ci-result
      - key: maintainer-merge
        role: Maintainer and Coordinator
        action: >-
          The Maintainer merges into main only with passing CI, no pending PR feedback,
          and the pushed revision matching the signed-off commit. Pending feedback or
          a revision mismatch blocks merge: the Coordinator reports it in chat and
          waits for Maintainer direction, even if CI passes.
        evidence: GitHub PR, CI, commit comparison and merge; chat blocker or direction.
        transitions:
          - when: Blocked; direction requires a file change.
            to: ci-diagnosis
          - when: Blocked without an authorized file change; wait for direction and recheck gate.
            to: maintainer-merge
          - when: Merge completed with all gates satisfied.
            to: remote-branch-deletion
      - key: remote-branch-deletion
        role: GitHub
        action: Delete the remote branch.
        evidence: GitHub branch deletion on the PR.
      - key: merge-confirmation
        role: Maintainer and Coordinator
        action: The Maintainer confirms the merge; the Coordinator closes Publish.
        evidence: GitHub merge, chat confirmation, and updated checkpoint.
  - name: Retro
    entry: Publish is closed.
    exit: retro-close
    completion: Every candidate draft is filed exactly as approved or dropped; all stage obligations are met.
    steps:
      - key: retro-drafts
        role: Coordinator and Maintainer
        action: >-
          The Coordinator asks the maintainer to start /retro (mattpocock-skills:retro)
          and follows it. Present candidate issue drafts.
        evidence: Chat skill invocation and drafts.
      - key: retro-draft-decisions
        role: Maintainer and Coordinator
        action: >-
          The Maintainer reviews each draft. The Coordinator revises commented drafts
          for another review, files approved drafts exactly as approved, and drops
          declined drafts.
        evidence: Chat decisions and revised drafts; GitHub issues for approved drafts.
        transitions:
          - when: Any draft still needs revision, review, or filing.
            to: retro-draft-decisions
          - when: Every draft filed or dropped, including when no candidates exist.
            to: retro-close
      - key: retro-close
        role: Coordinator
        action: Confirm every stage obligation is met and close Retro, completing the lifecycle.
        evidence: Chat completion confirmation; final checkpoint with Retro closed.
      - key: checkpoint-upload
        role: Coordinator
        action: >-
          After completion, upload and verify the final execution checkpoint as an issue
          comment using the Coordinator SOP method.
          On success tell the Maintainer, who archives the worktree. On failure
          report it and withhold the archive notice until upload and verification succeed.
        evidence: GitHub issue comment containing the checkpoint; chat success or failure report.
        transitions:
          - when: Upload or content verification fails; retry without reopening the completed lifecycle.
            to: checkpoint-upload
